[include homing.cfg]
#default doozer configuration
[gcode_macro _olli_globals]
variable_print_min: (0,0)
variable_print_max: (235,235)
variable_safe_home_x: 117.5 #"middle"
variable_safe_home_y: 117.5 #"middle"
variable_wait_x: 117.5 #"middle"
variable_wait_y: -5.0 #"middle"
gcode:

[printer]
kinematics: generic_cartesian
max_velocity: 500
max_accel: 2000
max_z_velocity: 20
max_z_accel: 100

[carriage x]
#0-254
position_endstop: -10
position_min: -10
position_max: 243
homing_speed: 80
homing_retract_dist: 0
endstop_pin: tmc2240_a:virtual_endstop

[carriage y]
#0-258
position_endstop: 237
position_min: -21
position_max: 237
homing_speed: 80
homing_retract_dist: 0
endstop_pin: tmc2240_b:virtual_endstop

[carriage z]
#position_endstop: 0
position_max: 205
position_min: -5
homing_speed: 8
homing_retract_dist: 0
endstop_pin: probe:z_virtual_endstop #z-probe
#endstop_pin: ^PF2 #tmc2240_z:virtual_endstop #m3-stop NC

# Motor0 - CoreXY B:back-left
[stepper b]
carriages: x+y
step_pin: M0_STEP_PIN
dir_pin: !M0_DIR_PIN
enable_pin: !M0_ENABLE_PIN
microsteps: 16
rotation_distance: 40

# Motor1 - CoreXY A:back-right
[stepper a]
carriages: x-y
step_pin: M1_STEP_PIN
dir_pin: !M1_DIR_PIN
enable_pin: !M1_ENABLE_PIN
microsteps: 16
rotation_distance: 40

## Motor0  BTT TMC2240
[tmc2240 stepper b]
cs_pin: M0_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 1.400 #1.400
interpolate: True
#stealthchop_threshold: 999999 spreadcycle
#coolstep_threshold: 20
diag0_pin: ^!M0_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#driver_SLOPE_CONTROL: 3 #lower driver temperature

[autotune_tmc stepper b]
motor: ldo-42sth48-2504ah
tuning_goal: performance
extra_hysteresis: 0
tbl: 2
toff: 0
sgt: 1
voltage: 24

## Motor1 BTT TMC2240
[tmc2240 stepper a]
cs_pin: M1_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 1.400 #1.400
interpolate: True
#stealthchop_threshold: 999999 spreadcycle
diag0_pin: ^!M1_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#coolstep_threshold: 20
#driver_SLOPE_CONTROL: 3 #lower driver temperature

[autotune_tmc stepper a]
motor: ldo-42sth48-2504ah
tuning_goal: performance
extra_hysteresis: 0
tbl: 2
toff: 0
sgt: 1
voltage: 24

# Motor2 - z front-left
[stepper z0]
carriages: z
step_pin: M2_STEP_PIN
dir_pin: M2_DIR_PIN
enable_pin: !M2_ENABLE_PIN
microsteps: 16
rotation_distance: 4

# Motor3 - z front-right
[stepper z1]
carriages: z
step_pin: M3_STEP_PIN
dir_pin: M3_DIR_PIN
enable_pin: !M3_ENABLE_PIN
microsteps: 16
rotation_distance: 4

# Motor4 - z back-center
[stepper z2]
carriages: z
step_pin: M4_STEP_PIN
dir_pin: M4_DIR_PIN
enable_pin: !M4_ENABLE_PIN
microsteps: 16
rotation_distance: 4

## Motor2
[tmc2240 stepper z0]
cs_pin: M2_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 1.400
interpolate: True
#diag0_pin: ^!M3_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#stealthchop_threshold: 999999
#driver_SLOPE_CONTROL: 3 #lower driver temperature

[autotune_tmc stepper z0]
motor: ldo-42sth48-2504ac
tuning_goal: silent
extra_hysteresis: 0
tbl: 2
toff: 0
sgt: 1
voltage: 24

## Motor3
[tmc2240 stepper z1]
cs_pin: M3_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 1.400
interpolate: True
#diag0_pin: ^!M4_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#stealthchop_threshold: 999999
#driver_SLOPE_CONTROL: 3 #lower driver temperature

[autotune_tmc stepper z1]
motor: ldo-42sth48-2504ac
tuning_goal: silent
extra_hysteresis: 0
tbl: 2
toff: 0
sgt: 1
voltage: 24

## Motor4
[tmc2240 stepper z2]
cs_pin: M4_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 1.400
interpolate: True
#diag0_pin: ^!M5_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#stealthchop_threshold: 999999
#driver_SLOPE_CONTROL: 3 #lower driver temperature

[autotune_tmc stepper z2]
motor: ldo-42sth48-2504ac
tuning_goal: silent
extra_hysteresis: 0
tbl: 2
toff: 0
sgt: 1
voltage: 24

## Toolhead
[extruder]
# Motor 7
step_pin: M7_STEP_PIN
dir_pin: M7_DIR_PIN
enable_pin: !M7_ENABLE_PIN
microsteps: 16
# 
rotation_distance: 24.031
gear_ratio: 7:1
full_steps_per_rotation: 200
max_extrude_only_velocity: 60
max_extrude_only_accel: 3000
pressure_advance: 0.0
pressure_advance_smooth_time: 0.030
# 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: HEATER_0_PIN # HE0
max_power: 1.0 #40 watt
sensor_pin: TEMP_0_PIN   # TH0
sensor_type: Generic 3950 # EPCOS 100K B57560G104F
max_extrude_only_distance: 100.0
min_extrude_temp: 170
min_temp: 0
max_temp: 300

#m8
[tmc2240 extruder]
cs_pin: M7_CS_PIN
spi_software_mosi_pin: DRIVER_SPI_MOSI_PIN
spi_software_miso_pin: DRIVER_SPI_MISO_PIN
spi_software_sclk_pin: DRIVER_SPI_SCLK_PIN
run_current: 0.565
interpolate: False
#diag0_pin: ^!M7_DIAG_PIN
#driver_SGT: 1 #sensifity: -64 (high) .. 63 (low)
#stealthchop_threshold: 999999
driver_SLOPE_CONTROL: 3 #lower driver temperature

#partcooling fan
[fan]
pin: FAN0_PIN

[heater_fan hotend_cooling_fan]
pin: FAN1_PIN # fan1
heater: extruder
heater_temp: 30.0
fan_speed: 1.0

##heatbed
[heater_bed]
heater_pin: FAN4_PIN # fan4
sensor_pin: TEMP_BED_PIN
sensor_type: Generic 3950 # EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120

[cartographer]
x_offset: 0
y_offset: 32.925
verbose: yes

[cartographer scan]
mesh_runs: 2
mesh_direction: x

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 20,20 # 10 ,   12 # positions seen from probe - offsets applied
mesh_max: 215,215 # 225 , 225 # positions seen from probe
zero_reference_position: 117.5 , 117.5 #z=0 position seen from probe position_safe_home=center of mesh - 12 | (117.9, 155.0) | (155.0, 155.0)
probe_count: 20,20
#algorithm: bicubic
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

[z_tilt]
#z screw positions seen from nozzle
z_positions: 
    -7.5, 24.5 #z0 front/left
    242.5, 24.5 #z1 front/right
    117.5, 274.5 #z2 back/center
# positions to probe seen from nozzle - no offsets applied
points: 
     15 ,   -18 #z0 f/l
    220 ,   -18 #z1 f/r
    117.5,  187 #z2 b/c
horizontal_move_z: 5
speed: 80
retries: 5
retry_tolerance: 0.01

