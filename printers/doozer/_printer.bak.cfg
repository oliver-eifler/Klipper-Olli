[include mainsail.cfg]

[include boards/octopus-pro-h723-11/board.cfg]
[include boards/host/config.cfg]

[include extras/cartographer.cfg]

[include printers/doozer/config.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3E001A001051313531383332-if00

[mcu rp2040_case]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E661A4D417606E2E-if00

[temperature_sensor case]
sensor_type: SHT3X
#i2c_address: deault 68 (0x44).
i2c_mcu: rp2040_case
i2c_bus: i2c0f #gpio20,gpio21

# Cartographer
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_1E0031001750303655333520-if00

[virtual_sdcard]
path: /home/olli/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

#overrides for default printer configuration
[fan_generic board_fan]
pin: FAN5_PIN
shutdown_speed: 0

[delayed_gcode onstart]
# This runs once at startup and initializes all macros.
initial_duration: 0.5
gcode:
  RESPOND MSG="Startup"
  SET_FAN_SPEED FAN=board_fan SPEED=1

##overrides
[extruder]
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114

